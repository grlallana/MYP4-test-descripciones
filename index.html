<!DOCTYPE html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Prueba de lectura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Figtree:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: exam booklet — the text sits on a paper sheet at the left, the questions on a working card at the right */
:root{
  --bg:#edf0ee; --paper:#fffef9; --card:#ffffff; --soft:#e2e7e4; --ink:#1b2420; --muted:#5b6762; --line:#cfd7d3;
  --accent:#1f6b52; --accent-ink:#ffffff; --pick:#e3f1ea;
  --good:#167a4c; --good-bg:#e1f3e9; --bad:#b4342a; --bad-bg:#fbe6e3; --warn:#9a6400; --warn-bg:#fdf1d8;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --paper:#1b2320; --card:#19201d; --soft:#25302b; --ink:#e6ece9; --muted:#9daaa4; --line:#2f3b36;
  --accent:#5cc49b; --accent-ink:#0b1712; --pick:#1f3a2f;
  --good:#5cc98f; --good-bg:#173126; --bad:#ff8a7c; --bad-bg:#3a1f1c; --warn:#f0c15a; --warn-bg:#3a2f15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --paper:#1b2320; --card:#19201d; --soft:#25302b; --ink:#e6ece9; --muted:#9daaa4; --line:#2f3b36;
  --accent:#5cc49b; --accent-ink:#0b1712; --pick:#1f3a2f;
  --good:#5cc98f; --good-bg:#173126; --bad:#ff8a7c; --bad-bg:#3a1f1c; --warn:#f0c15a; --warn-bg:#3a2f15; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
input,select{-webkit-user-select:text;user-select:text}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,38px);line-height:1.15}
h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.2}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:800;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.txt{width:100%;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 13px}
.txt:focus{border-color:var(--accent);outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* intro */
.intro{max-width:660px;margin:0 auto;padding-block:48px 64px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rules b{color:var(--ink)}
.small{font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* test bar */
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:14px;align-items:center;padding-block:10px;flex-wrap:wrap}
.who{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:12px;margin-left:6px;opacity:.75}
.bar .btn{margin-left:auto;padding:8px 16px}

/* test body */
main.test{padding-block:22px 60px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 30px;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;box-shadow:0 1px 0 var(--line)}
@media (max-width:860px){.sheet{position:static;max-height:none}}
.sheet h2{margin-bottom:6px}
.sheet p.gloss{font-family:var(--sans);font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sheet p{font-family:var(--serif);font-size:18px;line-height:1.65;margin:14px 0 0;max-width:62ch}
.qs{display:flex;flex-direction:column;gap:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.q .head{display:flex;gap:10px;align-items:baseline}
.q .num{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;min-width:24px}
.q .stem{font-weight:600}
.q .stem.es{font-family:var(--serif);font-weight:400;font-size:17px;line-height:1.55}
.opts{display:grid;gap:8px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--pick)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;width:16px}
.opt[aria-pressed="true"] .k{color:var(--accent);font-weight:700}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.bank li{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:10px}
.bank li.used{opacity:.5;text-decoration:line-through}
.bank b{font-family:var(--mono)}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.opt.let{width:44px;justify-content:center;font-family:var(--mono);font-weight:700;padding:8px 0}
.chosen{margin:10px 0 0}
.opt.let[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--card);border-radius:16px;padding:28px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;border-top:6px solid var(--accent)}
.dialog.warn{border-top-color:var(--warn)}
.dialog.lock{border-top-color:var(--bad)}
.err{color:var(--bad);font-size:14px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}

/* results */
.results{padding-block:20px 40px}
.sum{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
@media (max-width:860px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.sum .id{grid-column:1/-1}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:0}
.tile .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:16px;color:var(--muted);font-weight:400}
.tile.big{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.big .label,.tile.big .v small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.id .name{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:var(--mono);font-size:18px;letter-spacing:.08em}
.flags{display:flex;gap:6px 8px;flex-wrap:wrap;margin-top:12px}
.flag{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:var(--soft)}
.flag.alert{background:var(--warn-bg);color:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.col h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.col h3 span{font-family:var(--mono);font-weight:500}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.res li{display:grid;grid-template-columns:20px 22px minmax(0,1fr);gap:6px;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.35;align-items:start}
.res li:first-child{border-top:0}
.res .m{font-weight:800;font-size:15px;line-height:1.2}
.res .ok .m{color:var(--good)} .res .no .m{color:var(--bad)}
.res .n{font-family:var(--mono);color:var(--muted)}
.res .a{min-width:0}
.res .a span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .no .yours{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.res .corr{color:var(--good);font-weight:600}
.foot{margin-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* teacher */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.tgrid label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.okbox{background:var(--good-bg);border:1px solid var(--good);border-radius:10px;padding:12px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
/* Test content — shared by the website and the printable copies.
   Every answer depends only on the unit's slides and vocabulary lists (es / está / tiene / lleva / parece).
   d: 1 = doable, 3 = inference */
const TEST = {
  title: 'Prueba de comprensión lectora',
  subtitle: 'Descripción de personas · MYP4',
  parts: [
    {
      id: 'A', name: 'Part 1', type: 'mc',
      instructions: 'Read the text and choose the best answer for each question.',
      textTitle: 'La nueva profesora de arte',
      text: [
        'Este año tenemos una profesora nueva de arte. Se llama Inés y tiene treinta años. Es delgada y muy guapa. Es morena, pero lleva el pelo teñido de azul. Tiene el pelo largo y ondulado, los ojos verdes y la nariz respingona. También lleva gafas.',
        'Normalmente lleva unos pantalones grises, una camiseta negra y unas zapatillas rojas. Nunca lleva zapatos. También lleva un collar, muchas pulseras y unos pendientes largos. Es muy creativa: en clase siempre lleva un sombrero diferente.',
        'Al principio, Inés parece una persona tímida y un poco aburrida, porque no habla mucho. Pero en clase es muy simpática, divertida y paciente. Mi amigo Leo dice que es la mejor profesora del colegio.'
      ],
      items: [
        { d: 1, q: 'How old is Inés?', o: ['13', '30', '33', '40'], a: 1,
          why: '«Tiene treinta años»: she is 30.' },
        { d: 1, q: 'What colour are Inés\'s eyes?', o: ['Blue', 'Brown', 'Green', 'Grey'], a: 2,
          why: '«Tiene… los ojos verdes».' },
        { d: 1, q: 'What is Inés\'s hair like?', o: ['Short and curly', 'Long and wavy', 'Long and straight', 'Short and straight'], a: 1,
          why: '«Tiene el pelo largo y ondulado».' },
        { d: 1, q: 'What does Inés normally wear on her feet?', o: ['Red trainers', 'Black shoes', 'Sandals', 'Slippers'], a: 0,
          why: '«Lleva… unas zapatillas rojas. Nunca lleva zapatos».' },
        { d: 1, q: 'Which accessories does Inés wear?', o: ['A watch and a belt', 'A scarf and a backpack', 'A watch and a scarf', 'A necklace, bracelets and earrings'], a: 3,
          why: '«Lleva un collar, muchas pulseras y unos pendientes largos».' },
        { d: 1, q: 'When does Inés wear a hat?', o: ['Always in class', 'Never', 'Only in winter', 'Only at home'], a: 0,
          why: '«En clase siempre lleva un sombrero diferente».' },
        { d: 3, q: 'What is the natural colour of Inés\'s hair?', o: ['Blue', 'Dark brown / black', 'Blond', 'Red'], a: 1,
          why: '«Es morena» (dark-haired), «pero lleva el pelo teñido de azul»: the blue is dyed, so it is not her natural colour.' },
        { d: 3, q: 'Which sentence describes Inés best?', o: ['She is shy and boring', 'She is impatient and lazy', 'She is boring, but kind', 'She seems shy, but she is fun'], a: 3,
          why: '«Parece una persona tímida y un poco aburrida… Pero en clase es muy simpática, divertida y paciente». Parece = how she seems; es = what she is really like.' }
      ]
    },
    {
      id: 'B', name: 'Part 2', type: 'tf',
      instructions: 'Read the text and decide if each sentence is true or false.',
      textTitle: 'Los gemelos Marcos y Nico',
      glossary: 'primos = cousins · gemelos = twins',
      text: [
        'Marcos y Nico son mis primos. Son gemelos y tienen catorce años. Los dos son altos y delgados. Tienen el pelo castaño y rizado, los ojos azules y pecas.',
        'Pero llevan ropa muy diferente. Marcos siempre lleva una sudadera, unos pantalones cortos y unas zapatillas. Nico lleva una camisa blanca, un jersey de cuello alto y unos zapatos negros. Además, Nico lleva gafas y un reloj, pero Marcos no.',
        'Marcos es muy extrovertido y sociable. Nico parece tímido y un poco aburrido, pero con sus amigos es muy divertido. Los dos son inteligentes, pero Marcos es un poco perezoso y Nico es muy trabajador.'
      ],
      items: [
        { d: 1, q: 'Marcos and Nico are the same age.', a: true,
          why: '«Tienen catorce años»: they are both 14.' },
        { d: 1, q: 'The boys have green eyes.', a: false,
          why: '«Tienen… los ojos azules»: their eyes are blue.' },
        { d: 1, q: 'Marcos wears a white shirt.', a: false,
          why: 'Nico wears the white shirt (una camisa blanca). Marcos wears a hoodie (una sudadera).' },
        { d: 1, q: 'Both boys have curly hair.', a: true,
          why: '«Tienen el pelo castaño y rizado».' },
        { d: 1, q: 'Nico wears glasses.', a: true,
          why: '«Nico lleva gafas y un reloj, pero Marcos no».' },
        { d: 1, q: 'Marcos is very hardworking.', a: false,
          why: '«Marcos es un poco perezoso»: he is a bit lazy. Nico is the hardworking one (trabajador).' },
        { d: 3, q: 'Nico dresses more formally than Marcos.', a: true,
          why: 'Nico wears a shirt, a turtleneck jumper and shoes (camisa, jersey de cuello alto, zapatos). Marcos wears a hoodie, shorts and trainers (sudadera, pantalones cortos, zapatillas).' },
        { d: 3, q: 'Nico is a boring person.', a: false,
          why: '«Nico parece… un poco aburrido, pero con sus amigos es muy divertido». He seems boring, but he is really fun.' }
      ]
    },
    {
      id: 'C', name: 'Part 3', type: 'match',
      instructions: 'Read each description and choose the title that fits it best. Use each title only once. There are three titles you do not need.',
      titles: ['A young athlete', 'A cold winter day', 'An artist at work', 'A wedding', 'A very fit grandfather', 'A famous visitor in December', 'A birthday party', 'First day at a new school', 'A day at the beach'],
      items: [
        { d: 1, q: 'Lleva un traje de baño, unas sandalias y un sombrero.', a: 8,
          why: 'Un traje de baño (swimsuit) and sandals: a day at the beach.' },
        { d: 3, q: 'Es mayor y un poco gordo. Tiene barba blanca y bigote. Lleva un abrigo rojo, un cinturón negro, unos zapatos negros y un sombrero rojo. Parece una persona muy generosa.', a: 5,
          why: 'An older man with a white beard, a red coat, a black belt and a red hat who seems very generous: Father Christmas, a famous visitor in December.' },
        { d: 1, q: 'Lleva un abrigo, una bufanda, un jersey de cuello alto y unos pantalones largos.', a: 1,
          why: 'A coat, a scarf and a turtleneck jumper: clothes for a cold winter day.' },
        { d: 3, q: 'Es mayor y calvo, y tiene barba blanca. Pero es muy fuerte y musculoso. Lleva una sudadera, unos pantalones cortos y unas zapatillas.', a: 4,
          why: '«Es mayor… y tiene barba blanca»: he is old, so not a young athlete. Sports clothes and «muy fuerte y musculoso»: a very fit grandfather.' },
        { d: 1, q: 'Es un chico joven. Lleva un uniforme nuevo y una mochila nueva. Parece tímido porque no habla mucho.', a: 7,
          why: 'A new uniform and a new backpack, and he seems shy: his first day at a new school.' },
        { d: 1, q: 'Es joven y muy creativa. Tiene el pelo recogido y lleva una camiseta vieja y unos pantalones de muchos colores.', a: 2,
          why: '«Es… muy creativa» and she wears old clothes of many colours: an artist at work.' }
      ]
    }
  ],
  /* suggested conversion from points (out of 22) to the grade out of 8 */
  scale: [[21, 8], [19, 7], [16, 6], [13, 5], [10, 4], [7, 3], [5, 2], [2, 1], [0, 0]]
};


</script>
<script>
/* ---------- settings ---------- */
const TEACHER_HASH = 5733576610310718;           // hash of the teacher code (the code itself is not in this file)
const KEY = 'pruebaLectura.descripciones.v1';
const SALT = 'cis-moss-myp4';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app'), ov = $('#overlay');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LET = 'ABCDEFGHI';
function cyrb53(str, seed = 0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
const normCode = s => (s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const isTeacher = s => cyrb53(normCode(s) + SALT) === TEACHER_HASH;
const normName = s => (s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
const pad = n => String(n).padStart(2,'0');
const fmt = t => { const d = new Date(t); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function verifyCode(name, points, finished, exits, unlocks){
  const h = cyrb53(`${normName(name)}|${points}|${finished}|${exits}|${unlocks}|${SALT}`).toString(36).toUpperCase().padStart(6,'0').slice(-6);
  return h.slice(0,3) + '-' + h.slice(3);
}
function toast(msg, ms = 2800){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); }

/* ---------- state (saved on this computer, so a reload cannot reset the test) ---------- */
const TOTAL = TEST.parts.reduce((n, p) => n + p.items.length, 0);
function fresh(){ return { status:'intro', name:'', part:0, answers:{A:[],B:[],C:[]}, startedAt:0, finishedAt:0, exits:[], warned:false, unlocks:0, copyTries:0, lastExit:0 }; }
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e){ S = fresh(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- scoring ---------- */
function score(){
  let pts = 0; const per = {};
  TEST.parts.forEach(p => { per[p.id] = 0; p.items.forEach((it, i) => { if (S.answers[p.id][i] === it.a){ pts++; per[p.id]++; } }); });
  return { pts, per };
}
const grade = pts => TEST.scale.find(([min]) => pts >= min)[1];
function answerLabel(p, it, v){
  if (v === undefined || v === null || v === '') return '— no answer';
  if (p.type === 'mc') return `${'abcd'[v]} · ${it.o[v]}`;
  if (p.type === 'tf') return v ? 'True' : 'False';
  return `${LET[v]} · ${p.titles[v]}`;
}

/* ---------- leaving the test ---------- */
let fsActive = false, blurTimer = null;
function inTest(){ return S.status === 'test'; }
function recordExit(reason){
  if (!inTest()) return;
  const now = Date.now();
  if (now - S.lastExit < 1500) return;            // one leave = one event (blur + hidden + full screen fire together)
  S.lastExit = now;
  S.exits.push({ t: now, why: reason, back: null });
  if (S.warned) { S.status = 'locked'; save(); showLock(); }
  else { S.warned = true; S.pending = 'warning'; save(); showWarning(); }
}
/* when the student comes back, close the last exit and keep how long they were away */
function markBack(){ const e = S.exits[S.exits.length - 1]; if (e && e.back == null && S.status !== 'done' && S.status !== 'intro'){ e.back = Date.now(); save(); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') recordExit('left the page'); else markBack(); });
window.addEventListener('focus', () => setTimeout(() => { if (document.hasFocus()) markBack(); }, 50));
const away = e => (e.back || S.finishedAt || Date.now()) - e.t;
function dur(ms){ const s = Math.round(ms / 1000); if (s < 1) return 'under 1 s'; if (s < 60) return s + ' s'; return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s'; }
const clock = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const WHY = { 'left the page': 'changed tab or app', 'switched window': 'changed window', 'left full screen': 'left full screen', 'reloaded or closed the page': 'reloaded or closed the page' };
function exitList(){ return S.exits.map((e, i) => `<span class="flag alert">${i+1} · ${clock(e.t)} · away ${dur(away(e))} · ${WHY[e.why] || esc(e.why)}</span>`).join(''); }
window.addEventListener('blur', () => { clearTimeout(blurTimer); blurTimer = setTimeout(() => { if (!document.hasFocus()) recordExit('switched window'); }, 250); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fsActive){ fsActive = false; recordExit('left full screen'); } });
async function goFull(){
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen){ await document.documentElement.requestFullscreen(); } fsActive = !!document.fullscreenElement; }
  catch(e){ fsActive = false; }
}
function leaveFull(){ fsActive = false; if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }

/* ---------- copy, paste, translate ---------- */
function blocked(e){
  if (e.target && e.target.closest && e.target.closest('input')) return;   // name and teacher code can be typed
  e.preventDefault();
  if (inTest()){ S.copyTries++; save(); if (S.copyTries === 1) toast('Copy, paste and right-click are turned off during the test.'); }
}
['copy','cut','paste','contextmenu','dragstart'].forEach(ev => document.addEventListener(ev, blocked));
document.addEventListener('selectstart', e => { if (!(e.target.closest && e.target.closest('input'))) e.preventDefault(); });

/* ---------- screens ---------- */
function render(){
  ov.hidden = true;
  if (S.status === 'intro') return screenIntro();
  if (S.status === 'done') return screenResults();
  screenTest();
  if (S.status === 'locked') showLock();
  else if (S.pending === 'warning') showWarning();
}

function screenIntro(msg){
  app.innerHTML = `<div class="wrap"><div class="intro stack">
    <span class="label">${esc(TEST.subtitle)}</span>
    <h1>${esc(TEST.title)}</h1>
    <div class="card stack">
      <p style="margin:0">This test has <b>three parts</b> and <b>${TOTAL} questions</b>. Read the Spanish texts carefully: some answers are not written directly in the text, so you will need to think about what the text tells you.</p>
      <ul class="rules small">
        <li><b>Part 1:</b> read a text and choose the best answer.</li>
        <li><b>Part 2:</b> read a text and decide if each sentence is true or false.</li>
        <li><b>Part 3:</b> match each description with the best title.</li>
      </ul>
      <p style="margin:0"><b>Rules</b></p>
      <ul class="rules small">
        <li>The test opens in full screen. <b>Stay on this page until you finish.</b></li>
        <li>If you leave the page (another tab, another app, or full screen), you get <b>one warning</b>.</li>
        <li>If you leave a <b>second time</b>, the test is <b>locked</b> and only your teacher can open it again.</li>
        <li>Copy, paste and translation are turned off.</li>
        <li>You can move between the parts and change your answers until you press <b>Finish test</b>.</li>
        <li>At the end, <b>take a screenshot</b> of your results (⌘ + Shift + 4).</li>
      </ul>
    </div>
    <div class="card stack">
      <label for="name"><b>Your full name</b></label>
      <input class="txt" id="name" autocomplete="off" spellcheck="false" maxlength="40" placeholder="Name and surname">
      <p class="err" id="nerr" ${msg ? '' : 'hidden'}>${esc(msg || '')}</p>
      <div class="row"><button class="btn" id="start" type="button">Start the test</button></div>
    </div>
    <button class="linkbtn" id="tlink" type="button">Teacher</button>
  </div></div>`;
  const start = async () => {
    const n = $('#name').value.trim();
    if (n.split(/\s+/).length < 2){ $('#nerr').textContent = 'Write your name and surname.'; $('#nerr').hidden = false; return; }
    Object.assign(S, fresh(), { status:'test', name:n, startedAt:Date.now() });
    save(); await goFull(); render(); window.scrollTo(0,0);
  };
  $('#start').onclick = start;
  $('#name').onkeydown = e => { if (e.key === 'Enter') start(); };
  $('#tlink').onclick = teacherGate;
}

function screenTest(){
  const p = TEST.parts[S.part];
  const done = id => S.answers[id].filter(v => v !== undefined && v !== null).length;
  const tabs = TEST.parts.map((q, i) => `<button class="tab" type="button" data-p="${i}" aria-current="${i === S.part}">${q.name}<span class="n">${done(q.id)}/${q.items.length}</span></button>`).join('');
  let body;
  if (p.type === 'match'){
    const used = S.answers.C.filter(v => v !== undefined && v !== null);
    body = `<div class="split">
      <article class="sheet"><span class="label">${p.name} · Titles</span><h2>Choose a title</h2>
        <p class="small" style="font-family:var(--sans);font-size:15px">${esc(p.instructions)}</p>
        <ul class="bank" style="margin-top:14px;grid-template-columns:minmax(0,1fr)">${p.titles.map((t, k) => `<li class="${used.includes(k) ? 'used' : ''}"><b>${LET[k]}</b>${esc(t)}</li>`).join('')}</ul></article>
      <section class="stack"><div class="card"><span class="label">${p.name} · Matching</span><p style="margin:6px 0 0">Click the letter of the title that fits each description best.</p></div>
      <div class="qs">${p.items.map((it, i) => { const a = S.answers.C[i]; return `<div class="q"><div class="head"><span class="num">${i+1}</span><span class="stem es">${esc(it.q)}</span></div>
        <div class="letters" role="group" aria-label="Title for description ${i+1}">${p.titles.map((t, k) => `<button class="opt let" type="button" data-i="${i}" data-v="${k}" aria-pressed="${a === k}" title="${esc(t)}">${LET[k]}</button>`).join('')}</div>
        <p class="chosen small">${a === undefined || a === null ? '<span class="muted">No title chosen yet</span>' : `Your choice: <b>${LET[a]} · ${esc(p.titles[a])}</b>`}</p></div>`; }).join('')}</div>
      ${navHTML()}</section></div>`;
  } else {
    body = `<div class="split">
      <article class="sheet"><span class="label">${p.name} · Texto</span><h2>${esc(p.textTitle)}</h2>${p.text.map(t => `<p>${esc(t)}</p>`).join('')}${p.glossary ? `<p class="gloss">${esc(p.glossary)}</p>` : ''}</article>
      <section class="stack"><div class="card"><span class="label">${p.name} · ${p.type === 'mc' ? 'Multiple choice' : 'True or false'}</span><p style="margin:6px 0 0">${esc(p.instructions)}</p></div>
      <div class="qs">${p.items.map((it, i) => {
        const a = S.answers[p.id][i];
        const opts = p.type === 'mc'
          ? `<div class="opts">${it.o.map((o, k) => `<button class="opt" type="button" data-i="${i}" data-v="${k}" aria-pressed="${a === k}"><span class="k">${'abcd'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`
          : `<div class="opts two">${[[true,'True'],[false,'False']].map(([v, l]) => `<button class="opt" type="button" data-i="${i}" data-v="${v}" aria-pressed="${a === v}"><span>${l}</span></button>`).join('')}</div>`;
        return `<div class="q"><div class="head"><span class="num">${i+1}</span><span class="stem">${esc(it.q)}</span></div>${opts}</div>`;
      }).join('')}</div>${navHTML()}</section></div>`;
  }
  app.innerHTML = `<header class="bar"><div class="wrap"><span class="who" title="${esc(S.name)}">${esc(S.name)}</span><nav class="tabs">${tabs}</nav><button class="btn" id="finish" type="button">Finish test</button></div></header>
    <main class="test wrap">${body}</main>`;
  app.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.part = +b.dataset.p; save(); render(); window.scrollTo(0,0); });
  app.querySelectorAll('.opt.let').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, v = +b.dataset.v, j = S.answers.C.indexOf(v);
    if (S.answers.C[i] === v) S.answers.C[i] = null;               // click again to remove
    else { if (j > -1 && j !== i){ S.answers.C[j] = null; toast(`Title ${LET[v]} was moved from description ${j+1} to description ${i+1}.`); } S.answers.C[i] = v; }
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  });
  app.querySelectorAll('.opt:not(.let)').forEach(b => b.onclick = () => {
    const v = p.type === 'mc' ? +b.dataset.v : b.dataset.v === 'true';
    S.answers[p.id][+b.dataset.i] = v; save();
    b.parentElement.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b));
    updateTabs();
  });
  const prev = $('#prev'), next = $('#next');
  if (prev) prev.onclick = () => { S.part--; save(); render(); window.scrollTo(0,0); };
  if (next) next.onclick = () => { S.part++; save(); render(); window.scrollTo(0,0); };
  $('#finish').onclick = confirmFinish;
  const fin2 = $('#finish2'); if (fin2) fin2.onclick = confirmFinish;
}
function navHTML(){
  return `<div class="nav">${S.part > 0 ? `<button class="btn ghost" id="prev" type="button">← ${TEST.parts[S.part-1].name}</button>` : '<span></span>'}
    ${S.part < TEST.parts.length - 1 ? `<button class="btn" id="next" type="button">${TEST.parts[S.part+1].name} →</button>` : `<button class="btn" id="finish2" type="button">Finish test</button>`}</div>`;
}
function updateTabs(){
  app.querySelectorAll('.tab').forEach(b => { const q = TEST.parts[+b.dataset.p]; b.querySelector('.n').textContent = `${S.answers[q.id].filter(v => v !== undefined && v !== null).length}/${q.items.length}`; });
}

/* ---------- dialogs ---------- */
function dialog(cls, html){ ov.innerHTML = `<div class="dialog ${cls}" role="alertdialog" aria-modal="true">${html}</div>`; ov.hidden = false; }
function showWarning(){
  dialog('warn', `<span class="label" style="color:var(--warn)">Warning</span><h2>You left the test</h2>
    <p style="margin:0">This has been recorded. <b>This is your only warning.</b> If you leave the page again, the test will be locked and you will need your teacher to open it.</p>
    <div class="row"><button class="btn" id="back" type="button">Back to the test</button></div>`);
  $('#back').onclick = async () => { S.pending = null; save(); ov.hidden = true; await goFull(); };
  $('#back').focus();
}
function showLock(){
  dialog('lock', `<span class="label" style="color:var(--bad)">Test locked</span><h2>You left the test a second time</h2>
    <p style="margin:0">Your answers are saved. Put your hand up and wait for your teacher.</p>
    <label for="tcode" class="small"><b>Teacher code</b></label>
    <input class="txt" id="tcode" type="password" autocomplete="off" spellcheck="false">
    <p class="err" id="terr" hidden>That code is not correct.</p>
    <div class="row"><button class="btn danger" id="unlock" type="button">Unlock</button></div>`);
  const go = async () => {
    if (!isTeacher($('#tcode').value)){ $('#terr').hidden = false; return; }
    S.status = 'test'; S.unlocks++; S.lastExit = Date.now(); save(); ov.hidden = true; await goFull(); render();
  };
  $('#unlock').onclick = go; $('#tcode').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function confirmFinish(){
  const blank = TEST.parts.reduce((n, p) => n + p.items.filter((_, i) => S.answers[p.id][i] === undefined || S.answers[p.id][i] === null).length, 0);
  dialog('', `<span class="label">Finish</span><h2>Finish the test?</h2>
    <p style="margin:0">${blank ? `You have <b>${blank} question${blank > 1 ? 's' : ''} without an answer</b>. ` : 'You have answered every question. '}You cannot change your answers after this.</p>
    <div class="row"><button class="btn" id="yes" type="button">Yes, finish</button><button class="btn ghost" id="no" type="button">Keep working</button></div>`);
  $('#no').onclick = () => ov.hidden = true;
  $('#yes').onclick = () => { S.status = 'done'; S.finishedAt = Date.now(); save(); leaveFull(); render(); window.scrollTo(0,0); };
  $('#no').focus();
}

/* ---------- results ---------- */
function screenResults(){
  const { pts, per } = score(), g = grade(pts), fin = fmt(S.finishedAt);
  const mins = Math.max(1, Math.round((S.finishedAt - S.startedAt) / 60000));
  const code = verifyCode(S.name, pts, fin, S.exits.length, S.unlocks);
  const cols = TEST.parts.map(p => {
    const rows = p.items.map((it, i) => {
      const v = S.answers[p.id][i], ok = v === it.a;
      const yours = answerLabel(p, it, v), corr = answerLabel(p, it, it.a);
      return `<li class="${ok ? 'ok' : 'no'}"><span class="m" aria-label="${ok ? 'correct' : 'wrong'}">${ok ? '✓' : '✗'}</span><span class="n">${i+1}</span>
        <span class="a">${ok ? `<span>${esc(yours)}</span>` : `<span class="yours" title="${esc(yours)}">${esc(yours)}</span><span class="corr" title="${esc(corr)}">${esc(corr)}</span>`}</span></li>`;
    }).join('');
    return `<div class="col"><h3>${p.name} · ${p.type === 'mc' ? 'Multiple choice' : p.type === 'tf' ? 'True or false' : 'Matching'}<span>${per[p.id]}/${p.items.length}</span></h3><ul class="res">${rows}</ul></div>`;
  }).join('');
  app.innerHTML = `<div class="wrap results">
    <div class="sum">
      <div class="tile id"><span class="label">${esc(TEST.title)}</span><div class="name" title="${esc(S.name)}">${esc(S.name)}</div><div class="small muted">Finished ${fin} · ${mins} min</div></div>
      <div class="tile"><span class="label">Points</span><div class="v">${pts}<small> / ${TOTAL}</small></div></div>
      <div class="tile big"><span class="label">Nota</span><div class="v">${g}<small> / 8</small></div></div>
      <div class="tile"><span class="label">Left the test</span><div class="v">${S.exits.length}<small>${S.exits.length ? ` · ${dur(S.exits.reduce((n, e) => n + away(e), 0))} away` : ''}${S.unlocks ? ` · ${S.unlocks} unlock${S.unlocks > 1 ? 's' : ''}` : ''}</small></div></div>
      <div class="tile"><span class="label">Check code</span><div class="v code">${code}</div></div>
    </div>
    ${S.exits.length || S.copyTries ? `<div class="flags">${S.exits.length ? '<span class="flag"><b>Times left the test</b></span>' + exitList() : ''}${S.copyTries ? `<span class="flag alert">Copy/paste attempts: ${S.copyTries}</span>` : ''}</div>` : ''}
    <div class="cols">${cols}</div>
    <div class="foot"><span class="small muted">✓ correct · ✗ wrong: your answer is crossed out and the correct answer is in green. Take a screenshot now (⌘ + Shift + 4).</span>
      <button class="linkbtn" id="tlink" type="button">Teacher</button></div>
  </div>`;
  $('#tlink').onclick = teacherGate;
}

/* ---------- teacher panel ---------- */
function teacherGate(){
  dialog('', `<span class="label">Teacher</span><h2>Teacher access</h2>
    <label for="gcode" class="small"><b>Teacher code</b></label><input class="txt" id="gcode" type="password" autocomplete="off" spellcheck="false">
    <p class="err" id="gerr" hidden>That code is not correct.</p>
    <div class="row"><button class="btn" id="gok" type="button">Open</button><button class="btn ghost" id="gno" type="button">Cancel</button></div>`);
  const go = () => { if (!isTeacher($('#gcode').value)){ $('#gerr').hidden = false; return; } teacherPanel(); };
  $('#gok').onclick = go; $('#gcode').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#gno').onclick = () => ov.hidden = true; $('#gcode').focus();
}
function teacherPanel(){
  const st = S.status === 'intro' ? 'No test started on this computer.' : `${esc(S.name || '—')} · ${S.status === 'done' ? 'finished' : S.status === 'locked' ? 'locked' : 'in progress'} · left the test ${S.exits.length} time(s)`;
  const exl = S.exits.length ? `<div class="flags" style="margin-top:6px">${exitList()}</div>` : '';
  dialog('', `<span class="label">Teacher</span><h2>Teacher tools</h2>
    <p class="small muted" style="margin:0">On this computer: ${st}</p>${exl}
    <div class="stack" style="gap:8px"><b>Check a screenshot</b>
      <p class="small muted" style="margin:0">Copy the details from the student's screenshot. If the check code matches, the screenshot has not been edited.</p>
      <div class="tgrid">
        <label>Name<input class="txt" id="vname" autocomplete="off" spellcheck="false"></label>
        <label>Points (out of ${TOTAL})<input class="txt" id="vpts" inputmode="numeric" autocomplete="off"></label>
        <label>Finished (dd/mm/yyyy hh:mm)<input class="txt" id="vfin" autocomplete="off" placeholder="12/11/2026 10:45"></label>
        <label>Left the test<input class="txt" id="vex" inputmode="numeric" value="0" autocomplete="off"></label>
        <label>Unlocks<input class="txt" id="vun" inputmode="numeric" value="0" autocomplete="off"></label>
        <label>Check code<input class="txt" id="vcode" autocomplete="off" spellcheck="false" placeholder="ABC-123"></label>
      </div>
      <div class="row"><button class="btn" id="vgo" type="button">Check</button></div><div id="vout"></div></div>
    <div class="stack" style="gap:8px"><b>New attempt on this computer</b>
      <p class="small muted" style="margin:0">Deletes the saved test on this computer so another student (or the same one) can start again.</p>
      <div class="row"><button class="btn danger" id="reset" type="button">Delete and start again</button></div><div id="rconf"></div></div>
    <div class="row"><button class="btn ghost" id="tclose" type="button">Close</button></div>`);
  $('#vgo').onclick = () => {
    const exp = verifyCode($('#vname').value, +$('#vpts').value, $('#vfin').value.trim(), +$('#vex').value || 0, +$('#vun').value || 0);
    const ok = normCode(exp) === normCode($('#vcode').value);
    $('#vout').innerHTML = ok ? `<div class="okbox"><b>The code matches.</b> The screenshot shows the real result.</div>`
      : `<p class="err" style="margin:0"><b>The code does not match.</b> Check that you typed every detail exactly as on the screenshot (name spelling, points, date and time). If it still does not match, the screenshot may have been edited.</p>`;
  };
  $('#reset').onclick = () => {
    $('#rconf').innerHTML = `<div class="row"><span class="small">Are you sure? This cannot be undone.</span><button class="btn danger" id="reset2" type="button">Yes, delete</button></div>`;
    $('#reset2').onclick = () => { S = fresh(); save(); leaveFull(); render(); toast('The test was reset on this computer.'); };
  };
  $('#tclose').onclick = () => ov.hidden = true;
}

/* ---------- start ---------- */
/* a reload or a closed tab: if leaving was already recorded when the page was hidden, only close that exit; otherwise record it now */
const pending = S.exits.length && S.exits[S.exits.length - 1].back == null;
render();
if (S.status === 'test' && !pending && Date.now() - S.lastExit > 4000) recordExit('reloaded or closed the page');
if (document.visibilityState === 'visible') markBack();
</script>
</body>
</html>
